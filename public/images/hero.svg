<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2a22"/>
      <stop offset="0.5" stop-color="#14533f"/>
      <stop offset="1" stop-color="#3a9a72"/>
    </linearGradient>
    <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d6e4b"/>
      <stop offset="1" stop-color="#0c3d2a"/>
    </linearGradient>
    <linearGradient id="leafMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fae78"/>
      <stop offset="1" stop-color="#17704b"/>
    </linearGradient>
    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8be0ae"/>
      <stop offset="1" stop-color="#34a06c"/>
    </linearGradient>
    <g id="leaf">
      <path d="M0 0 C 40 -95, 250 -140, 420 -42 C 270 46, 80 56, 0 0 Z"/>
      <path d="M0 0 Q 210 -34 420 -42" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3"/>
      <path d="M120 -22 L 190 -78 M200 -32 L 270 -84 M280 -38 L 340 -78 M120 -14 L 190 26 M200 -22 L 270 20 M280 -30 L 340 4" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- back leaves -->
  <g>
    <use href="#leaf" fill="url(#leafDark)" transform="translate(-40 930) rotate(-78) scale(1.9)"/>
    <use href="#leaf" fill="url(#leafDark)" transform="translate(-30 930) rotate(-40) scale(1.8)"/>
    <use href="#leaf" fill="url(#leafDark)" transform="translate(1640 930) scale(-1.9 1.9) rotate(-78)"/>
    <use href="#leaf" fill="url(#leafDark)" transform="translate(1630 930) scale(-1.8 1.8) rotate(-40)"/>
  </g>

  <!-- middle leaves -->
  <g>
    <use href="#leaf" fill="url(#leafMid)" transform="translate(-20 940) rotate(-62) scale(1.55)"/>
    <use href="#leaf" fill="url(#leafMid)" transform="translate(-20 940) rotate(-22) scale(1.45)"/>
    <use href="#leaf" fill="url(#leafMid)" transform="translate(1620 940) scale(-1.55 1.55) rotate(-62)"/>
    <use href="#leaf" fill="url(#leafMid)" transform="translate(1620 940) scale(-1.45 1.45) rotate(-22)"/>
  </g>

  <!-- front leaves -->
  <g>
    <use href="#leaf" fill="url(#leafLight)" transform="translate(-10 960) rotate(-50) scale(1.1)"/>
    <use href="#leaf" fill="url(#leafLight)" transform="translate(-10 960) rotate(-8) scale(1.05)"/>
    <use href="#leaf" fill="url(#leafLight)" transform="translate(1610 960) scale(-1.1 1.1) rotate(-50)"/>
    <use href="#leaf" fill="url(#leafLight)" transform="translate(1610 960) scale(-1.05 1.05) rotate(-8)"/>
  </g>
</svg>
